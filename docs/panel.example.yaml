# Copy to local/panel.yaml and supply private paths. No build step is required.
mode: dry_run
host: 127.0.0.1
port: 8790
# Defaults for state_dir, locks_dir and runs_registry live under CROW_HOME/local/.
# state_dir: /home/user/hub/local/state/panel
# locks_dir: /home/user/hub/local/state/locks
# runs_registry: /home/user/hub/local/state/runs.jsonl
# real_home: /home/user
pending_md: null
pending:
  label: En attente
  sections:
    - {prefix: Brouillons, key: drafts, kind: drafts}
    - {prefix: Relances, key: followups, kind: followups}
    - {prefix: Décisions, key: decisions, kind: decisions}
    - {prefix: Dossiers, key: dossiers, kind: dossiers}
    - {prefix: Rangement, key: filing, kind: filing}
    - {prefix: Boîte de réception, key: inbox_note, kind: inbox_note}
    - {prefix: Réglé récemment, key: done, kind: done}
  root_map: []
files:
  roots: []
work_handoff_dir: null
mail:
  outlook_com: {enabled: false, timeout_seconds: 90, inbox_limit: 5000, history_scan_cap: 500, history_folder_cap: 12, history_index_cap: 100000}
  reply_closing_internal: []
  reply_closing_external: []
  signature_image: null
  triage_rules: null
  style_rules: null
  allowed_folders: []
  body_prefetch: 50
  stale_after_minutes: 120
  internal_domains: []
accounts:
  claude: {provider: claude, kinds: [mail_read]}
  worka: {provider: codex, kinds: [mail_style, files], power: high, model: gpt-5}
  workb: {provider: codex, kinds: [files], model: gpt-5}
projects: {}
dossiers: {}
# dossiers:
#   example-project:
#     path: /path/to/allowed/project
#     label: Project
#     last_crow_at: '2026-01-01T12:00:00+00:00'
#     # Or use the mtime of a known crow version inside the dossier:
#     # crow_version_file: /path/to/allowed/project/review.md
calendar:
  # Defaults to CROW_HOME/local/state/maj/calendar.json, written by maj.
  snapshot: null
  time_zone: null  # Use the snapshot's IANA time zone.
  stale_after_minutes: 120
notifications:
  enabled: false
  run_finished: true
  pending_overdue: true
  poll_seconds: 30
  min_interval_seconds: 120
  powershell_exe: powershell.exe
  app_id: null  # Use/register crow for the current Windows user. No admin rights.
# max_parallel remains a fallback for limits.total.
limits: {claude: 3, worka: 1, workb: 1, total: 5}
# Routines execute for real, even in dry_run mode. simulate_in_trial: true only prints
# the command in dry_run. daily_update waits for active runs unless wait_runs: false.
routines:
  maj: {argv: [], simulate_in_trial: false}
  daily_update: {argv: [], simulate_in_trial: false, wait_runs: true}
  # Example commands: ["/path/to/daily-update.sh", "--no-backup"] above,
  # ["/path/to/daily-update.sh", "--backup-only"] below. The script owns these flags.
  backup: {argv: [], simulate_in_trial: false}
  maj_schedule: []
floors: {}
# Action profiles use a deny-by-default PreToolUse hook. Unknown tools are refused.
# Missing tools remain unavailable until their schemas and permissions are verified.
# Dossier discovery: folders under these roots with file activity in the last
# `days` days appear under Dossiers, ranked by activity. depth [2, 3]: a folder at
# depth 2 is one dossier unless it holds only subfolders. exclude: glob patterns on
# the path relative to the root. Empty roots disable discovery.
dossiers_discover:
  roots: []            # e.g. [/home/user/work]
  depth: [2, 3]
  days: 14
  limit: 40
  exclude: []          # e.g. ["00_admin/tmp-*", "90_archive/*"]

# Classic Outlook is primary when its running COM application can be reached.
# The bridge never starts or closes Outlook. An unavailable application falls
# back to the existing connector runs. Values below contain no mailbox identity.
# mail.outlook_com:
#   enabled: true
#   powershell_exe: powershell.exe
#   timeout_seconds: 90
#   inbox_limit: 5000
#   history_scan_cap: 500
#   history_index_cap: 100000
