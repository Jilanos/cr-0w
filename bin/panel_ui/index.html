<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>crow</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Vues">
      <div class="rail-head">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">crow</span>
        <button type="button" class="icon-btn rail-collapse" id="rail-collapse" aria-label="Replier le menu" title="Replier le menu"></button>
      </div>
      <ul class="rail-list" id="rail-list"></ul>
      <div class="rail-foot">
        <button type="button" class="rail-item" id="theme-toggle"></button>
        <button type="button" class="rail-item" id="help-open"></button>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn only-narrow" id="nav-open" aria-label="Menu"></button>
        <button type="button" class="icon-btn back-btn" id="back-btn" aria-label="Retour à la liste" hidden></button>
        <h1 class="view-title" id="view-title">Aujourd'hui</h1>
        <div class="filter" id="filter-wrap">
          <input type="search" id="filter" placeholder="Filtrer" aria-label="Filtrer la liste" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="topbar-status" id="topbar-status"></div>
        <div class="topbar-actions" id="topbar-actions"></div>
        <button type="button" class="icon-btn chat-toggle" id="chat-toggle" aria-label="Afficher le chat" title="Chat (c)"></button>
      </header>
      <div class="banners" id="banners"></div>
      <div class="panes" id="panes">
        <section class="pane pane-list" id="pane-list" aria-label="Liste"></section>
        <section class="pane pane-detail" id="pane-detail" aria-label="Détail" tabindex="-1"></section>
        <aside class="pane pane-chat" id="pane-chat" aria-label="Chat"></aside>
      </div>
    </div>
  </div>

  <section class="drawer" id="drawer" aria-label="Journal">
    <header class="drawer-head">
      <button type="button" class="drawer-toggle" id="drawer-toggle" aria-expanded="false">
        <span>Journal</span><span class="badge" id="drawer-badge" hidden></span>
      </button>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="Fermer le journal"></button>
    </header>
    <div class="drawer-body" id="drawer-body">
      <p class="muted drawer-empty">Aucun journal ouvert. Les mises à jour et les runs suivis s'affichent ici en direct.</p>
    </div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title">
    <header class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button type="button" class="icon-btn" id="dialog-close" aria-label="Fermer"></button>
    </header>
    <div class="dialog-body" id="dialog-body"></div>
  </dialog>
</body>
</html>
